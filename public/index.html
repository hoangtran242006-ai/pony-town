<script>
document.body.setAttribute("data-host", window.location.origin + "/");

// ==========================================
// Multiplayer WebSocket Compatibility Layer
// ==========================================
(function() {
  window.__wsEvents = window.__wsEvents || [];
  const _NativeWS = window.WebSocket;
  if (!_NativeWS) return;

  class SubclassedWebSocket extends _NativeWS {
    constructor(url, protocols) {
      super(url, protocols);
      console.log('[WS] Connected to:', url);
      window.__wsEvents.push({ type: 'open', url: String(url), time: Date.now() });

      this.addEventListener('message', async (e) => {
        let b = e.data instanceof Blob ? await e.data.arrayBuffer() : e.data;
        if (b instanceof ArrayBuffer) {
          const dv = new DataView(b);
          const opcode = dv.byteLength >= 4 ? (dv.getUint32(0, true) & 0xff) : (dv.byteLength >= 1 ? dv.getUint8(0) : -1);
          const updateId = dv.byteLength >= 4 ? (dv.getUint32(0, true) >>> 8) : 0;
          window.__wsEvents.push({ type: 'recv', opcode, updateId, bytes: b.byteLength, time: Date.now() });
          if (window.__wsEvents.length > 30) window.__wsEvents.shift();
          document.body.setAttribute('data-ws-events', JSON.stringify(window.__wsEvents));
        }
      });
    }

    send(data) {
      if (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) {
        const len = data.byteLength || data.length || 0;
        window.__wsEvents.push({ type: 'send', bytes: len, time: Date.now() });
        if (window.__wsEvents.length > 30) window.__wsEvents.shift();
        document.body.setAttribute('data-ws-events', JSON.stringify(window.__wsEvents));
      }
      return super.send(data);
    }
  }

  // Preserve all standard WebSocket static properties (OPEN=1, CONNECTING=0, CLOSING=2, CLOSED=3)
  SubclassedWebSocket.CONNECTING = _NativeWS.CONNECTING;
  SubclassedWebSocket.OPEN = _NativeWS.OPEN;
  SubclassedWebSocket.CLOSING = _NativeWS.CLOSING;
  SubclassedWebSocket.CLOSED = _NativeWS.CLOSED;
  Object.setPrototypeOf(SubclassedWebSocket, _NativeWS);

  window.WebSocket = SubclassedWebSocket;

  setInterval(() => {
    try {
      const comp = window.ng ? window.ng.getComponent(document.querySelector('pony-town-app')) : null;
      let game = null;
      if (comp && comp.gameService && comp.gameService.game) {
        game = comp.gameService.game;
      }
      if (!game) {
        for (const k of Object.keys(window)) {
          if (window[k] && window[k].map && window[k].paletteManager) game = window[k];
        }
      }
      const rawEntities = (game && game.map && game.map.ha && game.map.ha.Ub) ? game.map.ha.Ub : [];
      const entities = rawEntities.map(e => ({
        id: e.j,
        name: e.B,
        type: e.type,
        x: e.x,
        y: e.y,
        bounds: e.regionBounds,
        clientFlags: e.clientFlags
      }));

      document.body.setAttribute('data-debug-game', JSON.stringify({
        hasComp: !!comp,
        hasGame: !!game,
        entityCount: entities.length,
        entities: entities
      }));
    } catch (err) {
      document.body.setAttribute('data-debug-error', err.message);
    }
  }, 500);
})();
</script>

<script>
var updatingIndexCache = !1;
function isApp() { return !1; }

// ==========================================
// Open Access: Auto-login with random guest name & Name Persistence
// ==========================================
// Intercept character save requests to persist updated character name permanently
(function() {
  const _origFetch = window.fetch;
  window.fetch = function(url, init) {
    if (typeof url === 'string' && (url.includes('/api/pony/save') || url.includes('/api/account/character'))) {
      try {
        if (init && init.body) {
          if (typeof init.body === 'string') {
            const parsed = JSON.parse(init.body);
            if (parsed && parsed.name) {
              console.log('[STORAGE] Persisting renamed character:', parsed.name);
              localStorage.setItem('pt_player_name', parsed.name);
            }
          }
        }
      } catch (e) {}
    }
    return _origFetch.apply(this, arguments);
  };
})();

(async function initAuth() {
  const params = new URLSearchParams(window.location.search);
  const u = params.get('u');
  const t = params.get('t');
  const s = params.get('s');
  const devAuth = params.get('dev_auth');
  let savedToken = localStorage.getItem('pt_session_token');
  let savedName = localStorage.getItem('pt_player_name');

  function launchClient() {
    var p = document.createElement("script");
    p.src = "/assets/scripts/bootstrap-33FTUFJL.js";
    p.type = "module";
    p.async = !0;
    document.body.appendChild(p);
  }

  // Helper: generate random guest name
  function randomGuestName() {
    const adjectives = ['Swift','Brave','Bright','Happy','Lucky','Cosmic','Silver','Golden','Crystal','Misty'];
    const nouns = ['Spark','Dash','Wing','Heart','Star','Pony','Hoof','Mane','Glow','Breeze'];
    const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
    const noun = nouns[Math.floor(Math.random() * nouns.length)];
    const num = Math.floor(Math.random() * 999) + 1;
    return adj + noun + num;
  }

  let authPayload = null;

  if (devAuth) {
    // Developer auth via secret URL param
    authPayload = { dev_auth: devAuth, u: u || savedName || 'Akira' };
  } else if (u && t && s) {
    // Magic link with signature
    authPayload = { u, t, s };
    localStorage.setItem('pt_player_name', u);
  } else if (savedToken) {
    // Restore previous session with persisted character name
    authPayload = { session_token: savedToken, name: savedName };
  } else {
    // Public open access: use persisted name or auto-register with random guest name
    const guestName = u || savedName || randomGuestName();
    localStorage.setItem('pt_player_name', guestName);
    const nowSec = Math.floor(Date.now() / 1000);
    // Generate signature using Web Crypto (matches server calculateSignature)
    try {
      const MAGIC_SECRET = 'pt_magic_secret_2026_9f82d1c6';
      const msgBuf = new TextEncoder().encode(`${guestName}|${nowSec}|${MAGIC_SECRET}`);
      const hashBuf = await crypto.subtle.digest('SHA-256', msgBuf);
      const hashHex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
      const sig = hashHex.substring(0, 10);
      authPayload = { u: guestName, t: String(nowSec), s: sig };
    } catch (e) {
      // Fallback: use localhost-style direct dev auth
      authPayload = { dev_auth: 'pt_dev_master_akira_8832', u: guestName };
    }
  }

  try {
    const endpoint = authPayload.session_token ? '/api/auth/session' : '/api/auth/verify';
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(authPayload)
    });

    const data = await resp.json();

    if (!resp.ok || !data.success) {
      if (authPayload.session_token) {
        // Session expired, clear it and try again with fresh guest name
        localStorage.removeItem('pt_session_token');
        window.location.reload();
        return;
      }
      // Auth failed for some other reason (e.g. reserved name conflict), retry with new name
      localStorage.removeItem('pt_session_token');
      const retryName = randomGuestName();
      localStorage.setItem('pt_player_name', retryName);
      const nowSec2 = Math.floor(Date.now() / 1000);
      const msgBuf = new TextEncoder().encode(`${retryName}|${nowSec2}|pt_magic_secret_2026_9f82d1c6`);
      const hashBuf = await crypto.subtle.digest('SHA-256', msgBuf);
      const hashHex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
      const sig = hashHex.substring(0, 10);
      const resp2 = await fetch('/api/auth/verify', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ u: retryName, t: String(nowSec2), s: sig })
      });
      const data2 = await resp2.json();
      if (data2.success && data2.session_token) {
        localStorage.setItem('pt_session_token', data2.session_token);
        if (data2.name) localStorage.setItem('pt_player_name', data2.name);
        document.cookie = `pt_session=${data2.session_token}; path=/; max-age=604800; SameSite=Lax`;
      }
      launchClient();
      return;
    }

    // Authentication succeeded
    if (data.session_token) {
      localStorage.setItem('pt_session_token', data.session_token);
      document.cookie = `pt_session=${data.session_token}; path=/; max-age=604800; SameSite=Lax`;
    }
    if (data.name) {
      localStorage.setItem('pt_player_name', data.name);
    }

    // Clean URL query parameters smoothly without reloading
    if (window.location.search) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    launchClient();
  } catch (err) {
    console.error('[AUTH] Verification error:', err);
    // On network error, still try to launch the client (offline fallback)
    launchClient();
  }
})();
</script>
